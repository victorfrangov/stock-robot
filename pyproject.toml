[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-robot"
version = "0.2.0"
description = "Daily swing-trading AI for S&P 500 stocks, paper-traded on Interactive Brokers"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "yfinance>=0.2.50",
    "requests>=2.31",
    "lxml>=5",
    "pyyaml>=6",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "ib_async>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
nn = ["torch>=2.2"]
fundamentals-ib = ["ib_fundamental"]
dev = ["pytest>=8"]

[project.scripts]
robot = "robot.cli:main"

[tool.setuptools.packages.find]
include = ["robot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
